# Fly.io config for the Thes1s Python export service.
# Lives at project root (not export-service/) so the Docker build context can
# access both export-service/app.py AND scripts/pdf/ in a single COPY tree.
# Deploy with:  fly deploy   (run from project root)

app = "thes1s-export"
primary_region = "iad"   # us-east, close to Cloudflare's Worker edge

[build]
  dockerfile = "export-service/Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"      # free tier: stop after idle to stay free
  auto_start_machines = true       # boot on next request (~2-5s)
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512                  # matplotlib needs >256MB headroom
