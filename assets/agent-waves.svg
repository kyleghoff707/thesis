<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
  <title id="title">Thesis /analyze sequential waves and parallel agents</title>
  <desc id="desc">A flow diagram showing that Thesis runs stages and waves sequentially, while agents inside each wave run in parallel.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14b8a6"/>
    </marker>
    <style>
      .bg { fill: url(#bg); }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; }
      .agent { fill: #ffffff; stroke: #99f6e4; stroke-width: 1.3; }
      .accent { fill: #14b8a6; }
      .accentDark { fill: #0f766e; }
      .tealSoft { fill: #ecfeff; stroke: #99f6e4; stroke-width: 1.3; }
      .slateSoft { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.3; }
      .title { font: 800 36px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 17px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #cbd5e1; }
      .h { font: 750 20px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #1e293b; }
      .h2 { font: 750 16px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #1e293b; }
      .label { font: 800 13px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f766e; letter-spacing: .04em; }
      .body { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #64748b; }
      .tiny { font: 650 10.5px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #64748b; letter-spacing: .02em; }
      .pillText { font: 800 12px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #f8fafc; letter-spacing: .04em; }
      .num { font: 850 22px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #ffffff; }
      .flow { stroke: #14b8a6; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .thinFlow { stroke: #14b8a6; stroke-width: 2.7; fill: none; marker-end: url(#arrow); }
      .parallel { stroke: #0f766e; stroke-width: 2.2; fill: none; stroke-dasharray: 5 6; }
      .divider { stroke: #cbd5e1; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="1100" rx="30"/>

  <!-- Header -->
  <g transform="translate(72 54)">
    <circle cx="20" cy="18" r="11" class="accent"/>
    <rect x="0" y="42" width="82" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="35" y="42" width="13" height="58" rx="6" class="accent"/>
    <text x="108" y="30" class="title">How /analyze orchestrates research agents</text>
    <text x="108" y="62" class="subtitle">Stages and waves are sequential. Agents inside the same wave run in parallel, then hand evidence to the next wave.</text>
  </g>

  <!-- Legend -->
  <g transform="translate(72 150)">
    <rect class="card" width="1256" height="92" rx="22"/>
    <rect x="30" y="24" width="142" height="44" rx="22" class="accent"/>
    <text x="60" y="52" class="pillText">CORE RULE</text>

    <g transform="translate(210 22)">
      <path class="thinFlow" d="M0 24 L116 24"/>
      <text x="138" y="20" class="h2">Sequential between waves</text>
      <text x="138" y="42" class="small">Wave 2 does not start until Wave 1 is saved and available.</text>
    </g>

    <line x1="650" y1="22" x2="650" y2="70" class="divider"/>

    <g transform="translate(690 18)">
      <rect x="0" y="0" width="96" height="24" rx="12" class="tealSoft"/>
      <rect x="0" y="34" width="96" height="24" rx="12" class="tealSoft"/>
      <path class="parallel" d="M112 4 C138 4 138 54 112 54"/>
      <text x="156" y="20" class="h2">Parallel inside a wave</text>
      <text x="156" y="42" class="small">Specialists dispatch together when they</text>
      <text x="156" y="60" class="small">share the same dependencies.</text>
    </g>
  </g>

  <!-- Start -->
  <g transform="translate(72 274)">
    <rect class="card" width="1256" height="84" rx="22"/>
    <text x="34" y="35" class="label">START</text>
    <text x="34" y="60" class="h">/analyze TICKER</text>
    <text x="252" y="35" class="body">Validate ticker · fetch canonical DataPacket · prepare SEC filings/transcripts</text>
    <text x="252" y="59" class="small">Create report cache and pass sliced inputs to the first screening agent.</text>
    <rect x="1084" y="22" width="132" height="40" rx="20" class="tealSoft"/>
    <text x="1116" y="47" class="label">~1.5 HOURS</text>
  </g>

  <path class="flow" d="M700 358 L700 394"/>

  <!-- Stage 1 -->
  <g transform="translate(72 400)">
    <rect class="card" width="1256" height="112" rx="22"/>
    <circle cx="54" cy="56" r="28" class="accent"/>
    <text x="47" y="64" class="num">1</text>
    <text x="104" y="34" class="label">STAGE 1 · SCREEN</text>
    <text x="104" y="60" class="h">One Pager</text>
    <text x="104" y="86" class="body">A single Sonnet agent runs the fast value-investing screen and returns PASS, WATCHLIST, or FAIL.</text>
    <rect x="950" y="28" width="226" height="56" rx="16" class="tealSoft"/>
    <text x="974" y="51" class="label">GATE</text>
    <text x="974" y="73" class="body">PASS/WATCHLIST continues · FAIL stops</text>
  </g>

  <path class="flow" d="M700 512 L700 548"/>

  <!-- Stage 2 -->
  <g transform="translate(72 554)">
    <rect class="card" width="1256" height="348" rx="22"/>
    <circle cx="54" cy="56" r="28" class="accent"/>
    <text x="46" y="64" class="num">2</text>
    <text x="104" y="34" class="label">STAGE 2 · RESEARCH CASE</text>
    <text x="104" y="60" class="h">Pitch Deck: five sequential waves</text>
    <text x="104" y="86" class="body">Each column below is a wave. Cards stacked inside a column dispatch together, then the completed wave becomes context for the next column.</text>

    <!-- Wave columns -->
    <g transform="translate(34 120)">
      <!-- W0 -->
      <g transform="translate(0 0)">
        <rect class="panel" width="224" height="178" rx="18"/>
        <text x="18" y="28" class="label">W0 · PRIMARY SOURCES</text>
        <rect class="agent" x="18" y="50" width="188" height="38" rx="12"/>
        <text x="32" y="74" class="body">Annual Reader</text>
        <rect class="agent" x="18" y="98" width="188" height="38" rx="12"/>
        <text x="32" y="122" class="body">Quarterly Reader</text>
        <text x="18" y="158" class="tiny">PARALLEL DISPATCH</text>
      </g>

      <path class="thinFlow" d="M232 89 L270 89"/>

      <!-- W1 -->
      <g transform="translate(278 0)">
        <rect class="panel" width="224" height="178" rx="18"/>
        <text x="18" y="28" class="label">W1 · BUSINESS</text>
        <rect class="agent" x="18" y="50" width="188" height="38" rx="12"/>
        <text x="32" y="74" class="body">Business Analyst</text>
        <rect class="agent" x="18" y="98" width="188" height="38" rx="12"/>
        <text x="32" y="122" class="body">Market Position</text>
        <text x="18" y="158" class="tiny">RUNS AFTER W0</text>
      </g>

      <path class="thinFlow" d="M510 89 L548 89"/>

      <!-- W2 -->
      <g transform="translate(556 0)">
        <rect class="panel" width="224" height="178" rx="18"/>
        <text x="18" y="28" class="label">W2 · DEEP ANALYSIS</text>
        <rect class="agent" x="18" y="45" width="188" height="34" rx="11"/>
        <text x="32" y="67" class="body">Moat Evaluator</text>
        <rect class="agent" x="18" y="85" width="188" height="34" rx="11"/>
        <text x="32" y="107" class="body">Financial Analyst</text>
        <rect class="agent" x="18" y="125" width="188" height="34" rx="11"/>
        <text x="32" y="147" class="body">Management Evaluator</text>
        <text x="18" y="168" class="tiny">PARALLEL DISPATCH</text>
      </g>

      <path class="thinFlow" d="M788 89 L826 89"/>

      <!-- W3 -->
      <g transform="translate(834 0)">
        <rect class="panel" width="224" height="178" rx="18"/>
        <text x="18" y="28" class="label">W3 · RISK / VALUE</text>
        <rect class="agent" x="18" y="50" width="188" height="38" rx="12"/>
        <text x="32" y="74" class="body">Risk Analyst</text>
        <rect class="agent" x="18" y="98" width="188" height="38" rx="12"/>
        <text x="32" y="122" class="body">Valuation Specialist</text>
        <text x="18" y="158" class="tiny">RUNS AFTER W2</text>
      </g>

      <path class="thinFlow" d="M1066 89 L1104 89"/>

      <!-- W4 -->
      <g transform="translate(1112 0)">
        <rect class="panel" width="108" height="178" rx="18"/>
        <text x="18" y="28" class="label">W4</text>
        <rect class="agent" x="14" y="58" width="80" height="54" rx="12"/>
        <text x="25" y="81" class="body">Synthesis</text>
        <text x="31" y="101" class="body">Writer</text>
        <text x="17" y="145" class="tiny">VERDICT</text>
      </g>
    </g>

    <rect x="34" y="318" width="1188" height="1" fill="#e2e8f0"/>
    <text x="34" y="335" class="small">Output: 12-section Pitch Deck. One wave must finish cleanly before the next begins; within-wave specialists run together to reduce total time without crossing dependencies.</text>
  </g>

  <path class="flow" d="M700 902 L700 938"/>

  <!-- Stage 3 -->
  <g transform="translate(72 944)">
    <rect class="card" width="1256" height="122" rx="22"/>
    <circle cx="54" cy="61" r="28" class="accent"/>
    <text x="46" y="69" class="num">3</text>
    <text x="104" y="36" class="label">STAGE 3 · CONVICTION</text>
    <text x="104" y="62" class="h">Final Thesis: parallel deep analysis, sequential debate, final trade plan</text>

    <g transform="translate(104 80)">
      <rect class="slateSoft" x="0" y="-18" width="248" height="36" rx="18"/>
      <text x="18" y="5" class="body">Phase 1: 5 specialists in parallel</text>
      <path class="thinFlow" d="M268 0 L326 0"/>
      <rect class="slateSoft" x="346" y="-18" width="358" height="36" rx="18"/>
      <text x="364" y="5" class="body">Phase 2: Bull → Bear → Rebuttal → Judge → Compose</text>
      <path class="thinFlow" d="M724 0 L782 0"/>
      <rect class="tealSoft" x="802" y="-18" width="210" height="36" rx="18"/>
      <text x="824" y="5" class="body">Phase 3: Trade plan</text>
    </g>
  </g>
</svg>
