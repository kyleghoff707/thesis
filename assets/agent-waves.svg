<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1320" role="img" aria-labelledby="title desc">
  <title id="title">Thesis /analyze sequential waves and parallel agents</title>
  <desc id="desc">A clean flow diagram showing that Thesis runs stages and waves sequentially, while agents inside each wave run in parallel.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14b8a6"/>
    </marker>
    <style>
      .bg { fill: url(#bg); }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; }
      .agent { fill: #ffffff; stroke: #99f6e4; stroke-width: 1.3; }
      .accent { fill: #14b8a6; }
      .tealSoft { fill: #ecfeff; stroke: #99f6e4; stroke-width: 1.3; }
      .slateSoft { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.3; }
      .title { font: 800 38px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 17px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #cbd5e1; }
      .h { font: 750 20px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #1e293b; }
      .h2 { font: 750 16px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #1e293b; }
      .label { font: 800 13px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f766e; letter-spacing: .04em; }
      .body { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #64748b; }
      .tiny { font: 650 10.5px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #64748b; letter-spacing: .02em; }
      .pillText { font: 800 12px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #f8fafc; letter-spacing: .04em; }
      .num { font: 850 22px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #ffffff; }
      .flow { stroke: #14b8a6; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .thinFlow { stroke: #14b8a6; stroke-width: 2.7; fill: none; marker-end: url(#arrow); }
      .parallel { stroke: #0f766e; stroke-width: 2.2; fill: none; stroke-dasharray: 5 6; }
      .divider { stroke: #cbd5e1; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="1320" rx="30"/>

  <!-- Header -->
  <g transform="translate(72 58)">
    <g aria-label="Thesis logo">
      <rect x="0" y="0" width="62" height="62" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <circle cx="31" cy="12" r="5.2" class="accent"/>
      <rect x="12" y="25" width="38" height="5.2" rx="2.6" fill="#cbd5e1"/>
      <rect x="27" y="25" width="8" height="28" rx="3" class="accent"/>
    </g>
    <text x="92" y="25" class="title">How /analyze runs research agents</text>
    <text x="94" y="58" class="subtitle">Sequential waves. Parallel agents inside each wave. Evidence handed forward cleanly.</text>
  </g>

  <!-- Global runtime badge -->
  <g transform="translate(1010 54)">
    <rect width="318" height="78" rx="22" class="tealSoft"/>
    <text x="30" y="32" class="label">TYPICAL FULL RUN</text>
    <text x="30" y="58" class="h">About 1.5 hours end-to-end</text>
  </g>

  <!-- Legend -->
  <g transform="translate(72 168)">
    <rect class="card" width="1256" height="96" rx="22"/>
    <rect x="30" y="26" width="142" height="44" rx="22" class="accent"/>
    <text x="60" y="54" class="pillText">CORE RULE</text>

    <g transform="translate(216 24)">
      <path class="thinFlow" d="M0 24 L112 24"/>
      <text x="136" y="20" class="h2">Sequential between waves</text>
      <text x="136" y="43" class="small">A wave starts only after the prior wave has finished and been saved.</text>
    </g>

    <line x1="658" y1="23" x2="658" y2="73" class="divider"/>

    <g transform="translate(704 19)">
      <rect x="0" y="0" width="96" height="24" rx="12" class="tealSoft"/>
      <rect x="0" y="36" width="96" height="24" rx="12" class="tealSoft"/>
      <path class="parallel" d="M112 5 C138 5 138 55 112 55"/>
      <text x="156" y="20" class="h2">Parallel inside a wave</text>
      <text x="156" y="43" class="small">Specialists with the same dependencies dispatch together.</text>
    </g>
  </g>

  <!-- Start -->
  <g transform="translate(72 296)">
    <rect class="card" width="1256" height="86" rx="22"/>
    <text x="34" y="35" class="label">START</text>
    <text x="34" y="61" class="h">/analyze TICKER</text>
    <text x="252" y="36" class="body">Validate ticker · fetch canonical DataPacket · prepare SEC filings and transcripts</text>
    <text x="252" y="61" class="small">Create report cache and pass sliced inputs to the first screening agent.</text>
  </g>

  <path class="flow" d="M700 382 L700 420"/>

  <!-- Stage 1 -->
  <g transform="translate(72 426)">
    <rect class="card" width="1256" height="116" rx="22"/>
    <circle cx="54" cy="58" r="28" class="accent"/>
    <text x="47" y="66" class="num">1</text>
    <text x="104" y="36" class="label">STAGE 1 · SCREEN</text>
    <text x="104" y="63" class="h">One Pager</text>
    <text x="104" y="91" class="body">A single Sonnet agent runs the fast value-investing screen and returns PASS, WATCHLIST, or FAIL.</text>
    <rect x="940" y="30" width="248" height="56" rx="16" class="tealSoft"/>
    <text x="966" y="53" class="label">GATE</text>
    <text x="966" y="75" class="body">PASS/WATCHLIST continues · FAIL stops</text>
  </g>

  <path class="flow" d="M700 542 L700 580"/>

  <!-- Stage 2 -->
  <g transform="translate(72 586)">
    <rect class="card" width="1256" height="384" rx="22"/>
    <circle cx="54" cy="58" r="28" class="accent"/>
    <text x="46" y="66" class="num">2</text>
    <text x="104" y="36" class="label">STAGE 2 · RESEARCH CASE</text>
    <text x="104" y="63" class="h">Pitch Deck: five sequential waves</text>
    <text x="104" y="91" class="body">Each column is a wave. Agents stacked inside a column dispatch together; the completed wave becomes context for the next column.</text>

    <!-- Equal-width wave columns -->
    <g transform="translate(34 132)">
      <!-- W0 -->
      <g transform="translate(0 0)">
        <rect class="panel" width="196" height="184" rx="18"/>
        <text x="18" y="29" class="label">W0 · SOURCES</text>
        <rect class="agent" x="18" y="52" width="160" height="38" rx="12"/>
        <text x="32" y="76" class="body">Annual Reader</text>
        <rect class="agent" x="18" y="102" width="160" height="38" rx="12"/>
        <text x="32" y="126" class="body">Quarterly Reader</text>
        <text x="18" y="164" class="tiny">PARALLEL DISPATCH</text>
      </g>
      <path class="thinFlow" d="M204 92 L240 92"/>

      <!-- W1 -->
      <g transform="translate(248 0)">
        <rect class="panel" width="196" height="184" rx="18"/>
        <text x="18" y="29" class="label">W1 · BUSINESS</text>
        <rect class="agent" x="18" y="52" width="160" height="38" rx="12"/>
        <text x="32" y="76" class="body">Business Analyst</text>
        <rect class="agent" x="18" y="102" width="160" height="38" rx="12"/>
        <text x="32" y="126" class="body">Market Position</text>
        <text x="18" y="164" class="tiny">RUNS AFTER W0</text>
      </g>
      <path class="thinFlow" d="M452 92 L488 92"/>

      <!-- W2 -->
      <g transform="translate(496 0)">
        <rect class="panel" width="196" height="184" rx="18"/>
        <text x="18" y="29" class="label">W2 · DEEP ANALYSIS</text>
        <rect class="agent" x="18" y="46" width="160" height="34" rx="11"/>
        <text x="32" y="68" class="body">Moat Evaluator</text>
        <rect class="agent" x="18" y="88" width="160" height="34" rx="11"/>
        <text x="32" y="110" class="body">Financial Analyst</text>
        <rect class="agent" x="18" y="130" width="160" height="34" rx="11"/>
        <text x="32" y="152" class="body">Management Eval.</text>
        <text x="18" y="176" class="tiny">PARALLEL DISPATCH</text>
      </g>
      <path class="thinFlow" d="M700 92 L736 92"/>

      <!-- W3 -->
      <g transform="translate(744 0)">
        <rect class="panel" width="196" height="184" rx="18"/>
        <text x="18" y="29" class="label">W3 · RISK / VALUE</text>
        <rect class="agent" x="18" y="52" width="160" height="38" rx="12"/>
        <text x="32" y="76" class="body">Risk Analyst</text>
        <rect class="agent" x="18" y="102" width="160" height="38" rx="12"/>
        <text x="32" y="126" class="body">Valuation Specialist</text>
        <text x="18" y="164" class="tiny">RUNS AFTER W2</text>
      </g>
      <path class="thinFlow" d="M948 92 L984 92"/>

      <!-- W4 -->
      <g transform="translate(992 0)">
        <rect class="panel" width="196" height="184" rx="18"/>
        <text x="18" y="29" class="label">W4 · SYNTHESIS</text>
        <rect class="agent" x="18" y="66" width="160" height="48" rx="12"/>
        <text x="38" y="86" class="body">Synthesis Writer</text>
        <text x="44" y="106" class="small">Investment verdict</text>
        <text x="18" y="164" class="tiny">12 SECTIONS ASSEMBLED</text>
      </g>
    </g>

    <line x1="34" y1="342" x2="1222" y2="342" class="divider"/>
    <text x="34" y="365" class="small">Output: 12-section Pitch Deck. Waves are sequential to preserve dependencies; agents within a wave run in parallel to reduce total time.</text>
  </g>

  <path class="flow" d="M700 970 L700 1008"/>

  <!-- Stage 3 -->
  <g transform="translate(72 1014)">
    <rect class="card" width="1256" height="238" rx="22"/>
    <circle cx="54" cy="65" r="28" class="accent"/>
    <text x="46" y="73" class="num">3</text>
    <text x="104" y="38" class="label">STAGE 3 · CONVICTION</text>
    <text x="104" y="65" class="h">Final Thesis: three sequential phases</text>
    <text x="104" y="94" class="body">The completed Pitch Deck is inherited first, then deep specialists run in parallel, debate runs sequentially, and the trade plan closes the loop.</text>

    <g transform="translate(104 124)">
      <g transform="translate(0 0)">
        <rect class="panel" width="360" height="84" rx="18"/>
        <text x="18" y="29" class="label">PHASE 1 · DEEP ANALYSIS</text>
        <text x="18" y="54" class="body">5 specialists run in parallel</text>
        <text x="18" y="73" class="small">Event · Business · Moat · Management · Valuation</text>
      </g>

      <path class="thinFlow" d="M372 42 L406 42"/>

      <g transform="translate(418 0)">
        <rect class="panel" width="438" height="84" rx="18"/>
        <text x="18" y="29" class="label">PHASE 2 · ADVERSARIAL DEBATE</text>
        <text x="18" y="54" class="body">Bull → Bear → Rebuttal → Judge → Compose</text>
        <text x="18" y="73" class="small">Sequential pressure test; each step depends on the prior output.</text>
      </g>

      <path class="thinFlow" d="M868 42 L902 42"/>

      <g transform="translate(914 0)">
        <rect class="panel" width="274" height="84" rx="18"/>
        <text x="18" y="29" class="label">PHASE 3 · TRADE PLAN</text>
        <text x="18" y="54" class="body">Position sizing + rules</text>
        <text x="18" y="73" class="small">Entry, sell, monitor, contingency.</text>
      </g>
    </g>
  </g>
</svg>
