name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Substantial features should be discussed in an issue before any code is written — please don't open a PR for a major feature without prior issue discussion.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user need, friction point, or gap this would address.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? What would the user experience look like? Be specific.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they're worse.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Where does this change live?
      options:
        - CLI / agent prompts
        - Frontend (Vite app)
        - Backend (Cloudflare Worker)
        - PDF/DOCX output
        - Documentation
        - Other
    validations:
      required: true
