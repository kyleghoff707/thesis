name = "thes1s-api"
main = "src/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# esbuild aliases — replace browser-only modules with Worker-compatible shims
# Fixes the import chain: edgarFinancials → cache → cacheStore → idb (browser-only)
[alias]
"idb" = "./src/shims/idb.js"

# esbuild defines — replace Vite-only import.meta.env expressions at compile time
# Fixes: apiBase.js, config.js which read import.meta.env at module level
[define]
# General define — handles dynamic bracket access (e.g. import.meta.env[key] in config.js).
# Without this, import.meta.env is undefined in Workers and bracket access throws.
# Specific defines below take precedence for exact dot-notation expressions.
"import.meta.env" = "{}"
"import.meta.env.DEV" = "false"
"import.meta.env.VITE_API_URL" = "'https://api.thes1sinvesting.com'"
"import.meta.env.VITE_CLAUDE_KEY" = "'proxy'"
"import.meta.env.VITE_ALPHA_VANTAGE_KEY" = "''"
"import.meta.env.VITE_ALPHA_VANTAGE_KEY_2" = "''"
"import.meta.env.VITE_EODHD_KEY" = "''"

[vars]
ENVIRONMENT = "production"
STRIPE_PRICE_ID = "price_1TKW1QQ4VrAqDXtS0MtUDWBJ"
STRIPE_METER_EVENT_NAME = "api_requests"
MA_ONE_PAGER_AGENT_ID = "agent_011CZzuB5TVsiPgnQZZJscmy"
MA_ENVIRONMENT_ID = "env_015GFMSSrnuhL1zwDYWyMfaz"
EXPORT_SERVICE_URL = "https://thes1s-export.fly.dev"  # Python Flask export service on Fly.io

# Pitch Deck agent IDs (Worker-side wave dispatch)
MA_PD_ANNUAL_READER = "agent_011Ca2vuGcG4jEp4WBAfnu95"
MA_PD_QUARTERLY_READER = "agent_011Ca2vq6XvSuuwDyRYt9oLM"
MA_PD_BUSINESS_ANALYST = "agent_011Ca1vzUNKzbzdQmX2aJqU2"
MA_PD_COMPETITOR_MARKET = "agent_011Ca2r7WPEjx8FwemeqETCA"
MA_PD_COMPETITOR_MOATS = "agent_011Ca2r9Do9mLtdBnf7QdEnM"
MA_PD_FINANCIAL_ANALYST = "agent_011Ca2sv9peUvMA7G1kzdFQP"
MA_PD_MANAGEMENT_EVALUATOR = "agent_011Ca2thF4fQLKtVVHVgYy3e"
MA_PD_RISK_ANALYST = "agent_011Ca2u5UMz9E1fN514pAvid"
MA_PD_VALUATION_SPECIALIST = "agent_011Ca2tZSVn2RTTxYa37YS8b"
MA_PD_SYNTHESIS_WRITER = "agent_011Ca31BD7pZ1Dz9ngZyUtXM"

# D1 database — create with: wrangler d1 create thes1s
[[d1_databases]]
binding = "DB"
database_name = "thes1s"
database_id = "86cba902-d3d3-4f96-a941-94998bdc060e"

# R2 bucket — create with: wrangler r2 bucket create thes1s-transcripts
[[r2_buckets]]
binding = "TRANSCRIPTS"
bucket_name = "thes1s-transcripts"

# Durable Objects — migration history (all classes deleted, kept for Cloudflare migration chain)
[[migrations]]
tag = "v1"
new_classes = ["PipelineRunner"]

[[migrations]]
tag = "v2"
deleted_classes = ["PipelineRunner"]
new_classes = ["SessionEventLoop"]

[[migrations]]
tag = "v3"
deleted_classes = ["SessionEventLoop"]

# Secrets (set via wrangler secret put):
#   ANTHROPIC_API_KEY — Claude API key (pipeline rebuild pending)
#   RESEND_API_KEY — for invite emails
#   ADMIN_EMAIL — your email for the initial admin account
#   SEC_USER_AGENT — e.g. "StockAnalyzer/1.0 kylehoff@example.com"

# Workers Paid plan ($5/mo) — 5 cron triggers
# Every 3hr: transcripts (6 AV calls per run, 48/day)
# Daily 6AM: insider trades (50 tickers per run, 10-day rotation)
# Monthly 1st 3AM: guru holdings (43 funds)
# Sunday 2AM: taxonomy refresh (IPOs, delistings, S&P 500, reclassifications)
# Sunday 5AM: stale data cleanup
# Observability — persists across deploys (dashboard settings get reset by wrangler deploy)
[observability]
enabled = true

[observability.logs]
enabled = true

[observability.traces]
enabled = true

[triggers]
crons = [
  "0 */3 * * *",
  "0 6 * * *",
  "0 3 1 * *",
  "0 2 * * SUN",
  "0 5 * * SUN"
]
