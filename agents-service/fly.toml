app = "thes1s-agents"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  # Build context = repo root (so we can COPY agents-v2/). Deploy from the project root with:
  #   fly deploy . --config agents-service/fly.toml

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
